adoption_mode: managed_architecture_metadata
managed_architecture_metadata: true
legacy_feature_contracts: false
architecture_generator: scripts/sync_architecture_docs.py
starter_sync:
  starter_baseline_ref: d6763b8d11d4e6cbf258eaeb47a5e1f584205b7c
  last_shared_surface_review_at: 2026-05-03
  reviewed_surface_classes:
    - repo_config
    - operating_system_docs
    - skills
    - adapters
    - generated_instruction_surfaces
    - validation_and_sync_scripts
  divergences:
    - path: repo_config/agent-adapter-mappings.json
      class: repo_config
      status: customized
      rationale: This repo publishes generated rules under `codex/` and includes the repo-local `src/fitcv/AGENTS.md` adapter output while intentionally omitting stale nested control-plane mappings.
    - path: repo_config/publication-config.json
      class: repo_config
      status: customized
      rationale: Public export paths remain FitCV-specific and use the current repo's `config/` and docs layout.
    - path: docs/operating_system/publication-workflow.md
      class: operating_system_docs
      status: customized
      rationale: Publication workflow keeps project-specific public mirror guidance while aligning with repo_config ownership.
    - path: docs/operating_system/feature-lifecycle.md
      class: operating_system_docs
      status: customized
      rationale: JOB-PROJECT now follows the starter helper-complete wrapper model but still documents repo-local truths such as `config/`, underscore feature IDs, and the current evidence-oriented rollout phases.
    - path: docs/operating_system/doc-system-lifecycle.md
      class: operating_system_docs
      status: customized
      rationale: The doc-system guidance is starter-aligned in structure but remains adapted to this repo's adopted `config/` layout and repo-local managed metadata surfaces.
    - path: .agents/skills/plan-document-reviewer/SKILL.md
      class: skills
      status: customized
      rationale: JOB-PROJECT keeps an additional repo-local review skill not present in the starter.
    - path: AGENTS.md
      class: generated_instruction_surfaces
      status: customized
      rationale: The generated repo instruction surface adopts applicable starter guidance while retaining repo-local path truths such as `config/`, `codex/rules/`, and advisory-only GitNexus usage.
    - path: scripts/validate_repo_contracts.py
      class: validation_and_sync_scripts
      status: customized
      rationale: JOB-PROJECT now includes a starter-style repo-config validator layer, but the contract gate still keeps the additional local adoption-shape validator on top of that narrower starter check.
    - path: scripts/validate_adoption_shape.py
      class: validation_and_sync_scripts
      status: customized
      rationale: JOB-PROJECT syncs the starter managed-root-doc metadata contract while retaining repo-local checks for underscore feature IDs, `config/` surfaces, generated lineage evidence, and Windows validation paths.
    - path: scripts/sync_architecture_docs.py
      class: validation_and_sync_scripts
      status: customized
      rationale: JOB-PROJECT now uses the starter helper-complete wrapper pattern, but the local wrapper still targets the repo-local generator and resolves the venv home interpreter so the focused pytest gate runs correctly on this Windows setup.
    - path: docs/features/*/feature.source.yaml
      class: operating_system_docs
      status: customized
      rationale: Managed feature IDs remain lowercase underscore identifiers for this repo even while feature sources otherwise follow the starter semantic shape.
