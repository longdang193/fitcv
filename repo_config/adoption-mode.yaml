notes: >
  JOB-PROJECT is aligning toward the project-OS-starter managed architecture
  metadata model. Managed features and stages now use source-owned lifecycle
  files plus generated contracts and discovery, uses explicit underscore
  feature-ID policy plus starter-aligned `statement`/`state` capabilities, and
  now expects selective file-level metadata, evidence-oriented lineage,
  alias-free generated YAML, generated current-state feature contracts, and
  CI-backed architecture validation. Remaining intentional drift is the
  underscore feature-ID policy; Phase 6 additionally hydrates lineage from explicit repo metadata
  and conservative feature-level spec/plan fallback evidence. Phase 7 adds a
  bounded direct-evidence pilot for selected `cv_system`,
  `inspection_debugging`, and `trigger_run_management` capabilities; Phase 8
  extends the same sparse evidence pilot to selected `settings_system` and
  `pipeline_performance` capabilities; Phase 9 extends it again to selected
  trigger and inspection capabilities; Phase 10 closes the residual
  settings/performance pilot set while keeping every enforced mapping backed by
  minimum code/test evidence; Phase 11 extends the same direct-evidence pilot
  to control-plane lifecycle and admin-core capabilities; Phase 12 extends the
  pilot to direct upload/snapshot capabilities plus the currently well-proven
  UI structure capabilities, while leaving broader theme-token and bootstrap
  surfaces deferred until they have explicit proof coverage; Phase 13 adds
  repo-local template ownership metadata plus direct proof coverage so the
  remaining `ui_consistency_theming` capabilities can participate truthfully in
  the evidence-oriented lineage model; Phase 14 closes the last two
  `inspection_debugging` evidence gaps by mapping CV-analysis and
  CV-generation run-health diagnostics to direct app ownership and proof tests.
