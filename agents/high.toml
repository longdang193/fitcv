developer_instructions = """
Complete the complex task delegated by the parent controller.

Analyze the problem thoroughly, verify important assumptions, and return
a clear recommendation or completed result to the parent.
Do not spawn child agents unless immutable packet grants `harness.delegate` and selects `read_only_research`.
"""

[model_providers.9router]
name = "9Router"
base_url = "http://127.0.0.1:20128/v1"
wire_api = "responses"
