name: Repo Hooks

on:
  push:
  pull_request:

defaults:
  run:
    shell: pwsh

jobs:
  adapter-integrity:
    name: Adapter Integrity
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Sync adapter outputs
        run: |
          $mappingFile = "repo_config/agent-adapter-mappings.json"
          $adapterMappings = @()
          if (Test-Path adapters) {
            $adapterMappings = @(Get-ChildItem adapters -Recurse -Include *.yaml,*.yml -File)
          }
          if (-not (Test-Path $mappingFile) -and $adapterMappings.Count -eq 0) {
            Write-Host "No adapter mappings in this repo. Skipping adapter sync check."
            exit 0
          }
          python scripts/sync_agent_adapters.py --check

      - name: Verify adapter outputs
        run: |
          if (-not (Test-Path .\scripts\verify_agent_adapters.ps1)) {
            Write-Host "Legacy adapter verification script is absent. Skipping legacy verification."
            exit 0
          }
          .\scripts\verify_agent_adapters.ps1

      - name: Fail on untracked generated outputs
        run: |
          $paths = @()
          if (Test-Path repo_config/agent-adapter-mappings.json) {
            $paths = @(
              (Get-Content -Raw repo_config/agent-adapter-mappings.json | ConvertFrom-Json | ForEach-Object {
                $_.destination
              })
            )
          }
          if (-not $paths) { exit 0 }
          $untracked = git ls-files --others --exclude-standard -- $paths
          if ($untracked) {
            Write-Host "Untracked generated outputs detected:"
            $untracked | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Fail on generated drift
        run: git diff --exit-code

  focused-smoke-tests:
    name: Focused Smoke Tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Run focused pytest smoke suite
        run: |
          python -m pytest tests/test_fitcv_cp/test_provider_registry.py tests/test_fitcv_cp/test_local_routes.py tests/test_fitcv_cp/test_app.py tests/test_prompts.py tests/test_llm_runtime.py tests/test_config.py tests/test_fitcv_pipeline_prototype.py -q

  architecture-docs:
    name: Architecture Docs
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Verify architecture generator output when configured
        run: |
          $generator = python -c "from pathlib import Path; import yaml; data = yaml.safe_load(Path('repo_config/adoption-mode.yaml').read_text(encoding='utf-8')); print(data.get('architecture_generator', 'none'))"
          if (($generator -eq 'none') -or (-not (Test-Path $generator))) {
            Write-Host "Configured architecture generator is absent. Skipping deprecated architecture sync check."
            exit 0
          }
          python $generator --check

  publication-boundary:
    name: Publication Boundary
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Run publication boundary dry check
        run: .\scripts\publish_public_repo.ps1
