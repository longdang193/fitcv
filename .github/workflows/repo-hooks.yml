name: Repo Hooks

on:
  push:
  pull_request:

defaults:
  run:
    shell: pwsh

jobs:
  adapter-integrity:
    name: Adapter Integrity
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Sync adapter outputs
        run: .\scripts\sync_agent_adapters.ps1

      - name: Verify adapter outputs
        run: .\scripts\verify_agent_adapters.ps1

      - name: Fail on untracked generated outputs
        run: |
          $paths = @(
            (Get-Content -Raw repo_config/agent-adapter-mappings.json | ConvertFrom-Json | ForEach-Object {
              $_.destination
            })
          )
          $untracked = git ls-files --others --exclude-standard -- $paths
          if ($untracked) {
            Write-Host "Untracked generated outputs detected:"
            $untracked | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Fail on generated drift
        run: git diff --exit-code

  baseline-tests:
    name: Baseline Tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Run pytest
        run: python -m pytest

  architecture-docs:
    name: Architecture Docs
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Verify architecture docs are current
        run: python scripts/sync_architecture_docs.py --check

      - name: Validate Mode B adoption shape
        run: python scripts/validate_adoption_shape.py

  publication-boundary:
    name: Publication Boundary
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Run publication boundary dry check
        run: .\scripts\publish_public_repo.ps1
