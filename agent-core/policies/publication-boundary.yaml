policy_id: publication_boundary
scope: private_repo
private_only_paths:
  - ".agents/"
  - ".cursor/"
  - "agent-core/"
  - "codex/rules/"
  - "docs/operating_system/"
  - "docs/superpowers/"
  - "logs/"
  - "sample/"
  - ".worktrees/"
