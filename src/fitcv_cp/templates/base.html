<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FitCV Admin{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    nav { background: #1a1d2e; border-bottom: 1px solid #2d3148; padding: 0 2rem; height: 56px; display: flex; align-items: center; gap: 1.5rem; }
    nav a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.15s; }
    nav a:hover { color: #fff; }
    nav .brand { color: #6366f1; font-weight: 700; font-size: 1.05rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; margin-bottom: 1.5rem; }
    h2 { font-size: 1.1rem; font-weight: 600; color: #cbd5e1; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { background: #1e2235; color: #64748b; font-weight: 600; text-align: left; padding: 0.65rem 1rem; border-bottom: 1px solid #2d3148; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
    td { padding: 0.7rem 1rem; border-bottom: 1px solid #1e2235; color: #cbd5e1; }
    tr:hover td { background: #1a1e30; }
    a { color: #6366f1; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-queued   { background: #334155; color: #94a3b8; }
    .badge-running  { background: #1e3a5f; color: #60a5fa; }
    .badge-succeeded{ background: #14532d; color: #4ade80; }
    .badge-failed   { background: #450a0a; color: #f87171; }
    .badge-info     { background: #1e3a5f; color: #60a5fa; }
    .badge-warning  { background: #422006; color: #fb923c; }
    .badge-error    { background: #450a0a; color: #f87171; }
    .card { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .error-box { background: #1c0a0a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .error-box strong { color: #f87171; display: block; margin-bottom: 0.35rem; }
    .form-row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
    input[type="text"] { background: #1e2235; border: 1px solid #3d4268; color: #e2e8f0; padding: 0.5rem 0.85rem; border-radius: 6px; font-size: 0.875rem; outline: none; width: 360px; }
    input[type="text"]:focus { border-color: #6366f1; }
    button { background: #6366f1; color: #fff; border: none; padding: 0.5rem 1.1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #4f46e5; }
    .meta { font-size: 0.8rem; color: #64748b; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 0.4rem 1.25rem; font-size: 0.875rem; }
    .kv .k { color: #64748b; }
    .kv .v { color: #e2e8f0; font-weight: 500; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">⚡ FitCV Admin</span>
    <a href="/admin/runs">Runs</a>
    <a href="/admin/settings">Settings</a>
    <a href="/healthz">Health</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
