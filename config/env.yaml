# GCP / BigQuery
gcp_project: "fitcv-491123"
bigquery_dataset: "fitcv"
service_account_key: "/workspaces/fitcv/fitcv-491123-51c030d71e07.json"
location: "US"

# AI models
gemini_model: "gemini-2.0-flash"
embedding_model: "text-embedding-005"

# Versions
enrichment_version: "v1"
prompt_version: "v1"

# Enrichment
enrichment_sleep_secs: 1.0

# Embeddings
embedding_batch_size: 100

# Semantic retrieval
vector_top_n: 50
vector_max_candidate_skills: 15
retrieval_strategy: "job_summary_v1"

# AI reranking
rerank_top_n: 50
rerank_sleep_secs: 0.5

# Candidate profile path
paths:
  candidate_profile: "data/candidate_profile.yaml"

# Pipeline orchestrator top-N limits
pipeline:
  vector_search_top_n: 50
  ai_score_top_n: 50
  final_top_n: 10
  evidence_top_k: 5

# Rule filter config (consumed by rule_filter.py)
seniority_ladder:
  - intern
  - junior
  - mid
  - senior
  - lead
  - principal
  - staff
  - director

# Application status enum (consumed by tracker.py)
application_statuses:
  - applied
  - interviewing
  - offered
  - rejected
  - no_response
