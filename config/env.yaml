gcp_project: "fitcv-491123"
bigquery_dataset: "fitcv"
service_account_key: "sa_key.json"

embedding_model: "text-embedding-005"
gemini_model: "gemini-2.5-flash"
ai_score_model: "gemini-2.5-flash"
location: "us-central1"

# Throughput & retry knobs for enrich stage
enrichment_sleep_secs: 3      # seconds between Gemini calls; increase if hitting 429s
enrichment_max_retries: 3     # retry attempts on ResourceExhausted before failing

# CV generation limits
max_cv_jobs: 10

# Minimum quality score to keep posting after cv_analysis stage
cv_analysis_min_score: 0.60

# Taxonomy-based deterministic rule filter thresholds
required_skill_overlap_min: 0.40
preferred_skill_overlap_min: 0.30
language_match_min: 0.20
summary_quality_min: 0.50

# Semantic retrieval
vector_top_n: 50
vector_max_candidate_skills: 15
retrieval_strategy: "job_summary_v1"

# AI reranking
rerank_top_n: 50
rerank_sleep_secs: 0.5

# Candidate profile path
paths:
  candidate_profile: "data/candidate_profile.private.yaml"

# Pipeline orchestrator top-N limits
pipeline:
  vector_search_top_n: 50
  ai_score_top_n: 50
  final_top_n: 10
  evidence_top_k: 5

# Rule filter config (consumed by rule_filter.py)
seniority_ladder:
  - intern
  - junior
  - mid
  - senior
  - lead
  - principal
  - staff
  - director

# Application status enum (consumed by tracker.py)
application_statuses:
  - applied
  - interviewing
  - offered
  - rejected
  - no_response
