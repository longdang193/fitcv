gcp_project: "fitcv-491123"
bigquery_dataset: "fitcv"
service_account_key: "sa_key.json"

location: "us-central1"

# Throughput & retry knobs for enrich stage
enrichment_max_retries: 3     # retry attempts on ResourceExhausted before failing

# CV generation limits
max_cv_jobs: 10

# Minimum quality score to keep posting after cv_analysis stage
cv_analysis_min_score: 0.60

# Taxonomy-based deterministic rule filter thresholds
required_skill_overlap_min: 0.40
preferred_skill_overlap_min: 0.30
language_match_min: 0.20
summary_quality_min: 0.50

# Candidate profile path
paths:
  candidate_profile: "data/candidate_profile.yaml"

# Rule filter config (consumed by rule_filter.py)
seniority_ladder:
  - intern
  - junior
  - mid
  - senior
  - lead
  - principal
  - staff
  - director

# Application status enum (consumed by tracker.py)
application_statuses:
  - applied
  - interviewing
  - offered
  - rejected
  - no_response

# Option B acceptance strictness policy (SSOT)
cv_acceptance_policy:
  enabled: true
  enforce_for_fit_labels:
    - stretch
  min_required_match_score: 0.50
  min_required_skill_support_ratio: 0.50
  downgrade_status: review_required
  review_reason_code: policy_acceptance
