schema_version: fitcv.analytics_metrics.v1
published_artifact:
  path: data/fitcv-analytics
projection_inputs:
  - config/analytics_metrics.yaml
  - scripts/fitcv_analytics.py
  - scripts/benchmark_cv_efficiency.py
  - scripts/sql/fitcv_gold_views.sql
  - scripts/verify_fitcv_acceptance.py
  - tests/fixtures/analytics_semantic_contract.json
semantic_output_fields:
  - metric_id
  - metric_version
  - cohort_id
  - cohort_type
  - dimension_key
  - numerator
  - denominator
  - value
  - coverage_status
  - coverage_numerator
  - coverage_denominator
  - unavailable_reason
  - source_commit
  - input_fingerprint
  - material_digest
metrics:
  - metric_id: acceptance_yield
    version: 1
    source_model: gold_cohort_effort
    grain: cohort
    numerator: distinct attempted jobs producing accepted CV
    denominator: distinct eligible attempted jobs
    dimensions: [cohort_id, cohort_type, source_mix, date_range]
    cohort_policy: compare equivalent eligible cohorts only
    null_policy: unavailable when denominator is zero or eligibility is incomplete
    coverage_metric: eligible_attempt_coverage
    owner: analytics
    description: Accepted CV yield across eligible attempted jobs.
    numerator_field: successful_run_job_count
    denominator_field: generation_job_count
    dimension_fields: [cohort_id]
  - metric_id: provider_calls_per_accepted_cv
    version: 1
    source_model: gold_cohort_effort
    grain: cohort
    numerator: all provider calls including failed attempts and retries
    denominator: distinct accepted artifacts
    dimensions: [cohort_id, cohort_type, source_mix, date_range]
    cohort_policy: keep current and historical cohorts separate
    null_policy: unavailable when accepted artifact identity or telemetry is incomplete
    coverage_metric: provider_call_coverage
    owner: analytics
    description: Provider workload per accepted artifact.
    numerator_field: provider_call_count
    denominator_field: accepted_artifact_count
    dimension_fields: [cohort_id]
  - metric_id: tokens_per_accepted_cv
    version: 1
    source_model: gold_cohort_effort
    grain: cohort
    numerator: all measured provider tokens including failed attempts and retries
    denominator: distinct accepted artifacts
    dimensions: [cohort_id, cohort_type, source_mix, date_range]
    cohort_policy: keep current and historical cohorts separate
    null_policy: unavailable when token telemetry is incomplete or denominator is zero
    coverage_metric: token_coverage
    owner: analytics
    description: Provider tokens per accepted artifact.
    numerator_field: token_total
    denominator_field: accepted_artifact_count
    dimension_fields: [cohort_id]
  - metric_id: first_pass_success
    version: 1
    source_model: gold_cohort_effort
    grain: cohort
    numerator: jobs with generation attempt one accepted and durable canonical artifact without regeneration
    denominator: eligible attempted generation jobs
    dimensions: [cohort_id, cohort_type, source_mix, date_range]
    cohort_policy: compare equivalent generation cohorts only
    null_policy: unavailable when denominator is zero, retry identity is incomplete, or accepted-artifact identity is missing
    coverage_metric: generation_attempt_coverage
    owner: analytics
    description: First-pass acceptance rate.
    numerator_field: first_pass_success_count
    denominator_field: generation_job_count
    dimension_fields: [cohort_id]
  - metric_id: manual_effort
    version: 1
    source_model: gold_run_job_effort
    grain: run_job
    numerator: distinct durable human actions
    denominator: one attempted run-job
    dimensions: [run_job_id, cohort_id, cohort_type]
    cohort_policy: no UI click counting
    null_policy: unavailable when action telemetry is absent
    coverage_metric: review_action_coverage
    owner: analytics
    description: Durable human effort associated with one attempted run-job.
    numerator_field: review_action_count
    denominator_field: manual_attempted_run_job_count
    dimension_fields: [run_job_id]
  - metric_id: verified_one_page_rate
    version: 1
    source_model: gold_cohort_effort
    grain: cohort
    numerator: accepted artifacts with valid native render proof
    denominator: accepted artifacts with measurable render evidence
    dimensions: [cohort_id, cohort_type, source_mix, date_range]
    cohort_policy: require comparable render evidence coverage
    null_policy: unavailable when render evidence coverage is incomplete
    coverage_metric: render_proof_coverage
    owner: analytics
    description: Verified native one-page rate.
    numerator_field: verified_one_page_count
    denominator_field: render_proof_count
    dimension_fields: [cohort_id]
  - metric_id: skill_demand
    version: 1
    source_model: gold_requirement_demand
    grain: requirement_and_cohort
    numerator: distinct eligible postings in imported opportunity corpus containing requirement X
    denominator: distinct eligible postings in cohort
    dimensions: [requirement, cohort_id, cohort_type, source_mix, date_range]
    cohort_policy: deduplicate requirement occurrences within one posting
    null_policy: unavailable when posting inventory or requirement extraction coverage is unknown or incomplete
    coverage_metric: posting_inventory_coverage
    owner: analytics
    description: Requirement demand in imported opportunity corpus.
    numerator_field: numerator_posting_count
    denominator_field: denominator_posting_count
    dimension_fields: [requirement]
  - metric_id: evidence_gap
    version: 1
    source_model: gold_candidate_gap
    grain: requirement_and_cohort
    numerator: distinct requirements in one explicit gap category
    denominator: distinct eligible posting requirements in cohort
    dimensions: [requirement, gap_category, candidate_profile_id, candidate_profile_revision, candidate_profile_fingerprint, cohort_id, cohort_type, source_mix, date_range]
    cohort_policy: keep missing evidence, unmet qualifier, uncertain interpretation, and unevaluated separate
    null_policy: unavailable when candidate or posting coverage is incomplete
    coverage_metric: candidate_requirement_coverage
    owner: analytics
    description: Candidate evidence gap by explicit category, never an unsupported inability claim.
    numerator_field: numerator_requirement_count
    denominator_field: denominator_requirement_count
    dimension_fields: [requirement, gap_category, candidate_profile_id, candidate_profile_revision, candidate_profile_fingerprint]
claim_priority_map:
  p0_acceptance_scope: [p0_a, p0_b, p0_c]
  p1_acceptance_scope: [p1_a, p1_b, p1_c]
  p1b_current_contract_measurement: [p1_b]
  p2_acceptance_scope: [p2]
