# @architecture
# owner: operator_control_plane
# features:
#   - none
# stages:
#   - none
# capabilities:
#   - operator-control-plane-phase-2-portability
# role: config
# canonical: true

control_plane:
  data_backend:
    type: bigquery
    bigquery:
      project: fitcv-491123
      dataset: fitcv
    sqlite:
      path: data/fitcv_cp.sqlite3

  providers:
    openai_compatible:
      base_url: https://api.moonshot.ai/v1
    openai:
      base_url: https://api.openai.com/v1

  model_routing:
    parts:
      enrich_extraction:
        provider: openai_compatible
        model: kimi-k2-instruct
      cv_generation_structured_write:
        provider: openai_compatible
        model: kimi-k2-thinking
      cv_analysis_semantic_alignment:
        provider: openai
        model: text-embedding-3-large
    task_overrides: {}

  observability:
    emit_model_routing_diagnostics: true
    emit_backend_capability_diagnostics: true
    otel_export_enabled: true

  feature_flags:
    sqlite_mode_enabled: true
