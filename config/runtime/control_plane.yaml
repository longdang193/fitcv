control_plane:
  data_backend:
    type: sqlite
    sqlite:
      path: data/fitcv_cp.sqlite3

  providers:
    openai_compatible:
      # 9router
      base_url: http://127.0.0.1:20128/v1
      # opencode
      # base_url: https://opencode.ai/zen/go/v1/chat/completions
      wire_api: responses
      auth_mode: required
      timeout_seconds: 300
    openai:
      base_url: https://api.openai.com/v1
      wire_api: chat_completions
      auth_mode: required
      timeout_seconds: 300

  model_routing:
    parts:
      candidate_profile_base_mapping:
        provider: openai_compatible
        model: cx/gpt-5.4-mini
      candidate_profile_derived_claims:
        provider: openai_compatible
        model: cx/gpt-5.4-mini
      enrich_extraction:
        provider: openai_compatible
        # model: ds/deepseek-v4-flash
        model: cx/gpt-5.4-mini
      ranking_ai_score:
        provider: openai_compatible
        # model: ds/deepseek-v4-flash
        model: cx/gpt-5.4-mini
      cv_generation_structured_write:
        provider: openai_compatible
        # model: ds/deepseek-v4-flash
        model: cx/gpt-5.4-mini
      synonym_triage_recommendation:
        provider: openai_compatible
        model: cx/gpt-5.4-mini
    task_overrides: {}

  observability:
    emit_model_routing_diagnostics: true
    emit_backend_capability_diagnostics: true
    otel_export_enabled: true

  feature_flags:
    sqlite_mode_enabled: true

  fitcv_cp:
    retry:
      maximum_attempts: 1
      initial_backoff_seconds: 1
      lease_seconds: 900
      reconciler_interval_seconds: 30
      error_detail_limit: 2048
