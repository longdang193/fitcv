# Ranking policy — weights, thresholds, missing-value defaults.
# Consumed by: ranking.py (Task 10), ai_score.py (fit_label derivation).

# ── Feature weights (must sum to 1.0) ─────────────────────────────────────────
ranking_weights:
  ai_score: 0.40
  must_have_match: 0.20
  vector_similarity: 0.15
  title_relevance: 0.10
  seniority_fit: 0.10
  preference_fit: 0.05

# ── Fit label thresholds (used by ai_score.py and ranking.py) ─────────────────
# score >= strong_threshold        → strong
# score >= stretch_threshold       → stretch
# score <  stretch_threshold       → skip
fit_label_thresholds:
  strong: 0.70
  stretch: 0.40

# ── Missing-value defaults for ranking features ────────────────────────────────
# Conservative (0.0) for signals that indicate unknown fit.
# Neutral (0.5) for signals where absence should not penalise the job.
missing_value_defaults:
  ai_score: 0.0          # conservative: failed scoring → unknown fit
  must_have_match: 0.0   # conservative: no candidate skills → cannot satisfy requirement
  vector_similarity: 0.0 # conservative: not retrieved → low semantic match
  title_relevance: 0.5   # neutral: missing title should not penalise
  seniority_fit: 0.5     # neutral: unknown seniority already passed rule filter
  preference_fit: 0.5    # neutral: no preference declared → no penalty
