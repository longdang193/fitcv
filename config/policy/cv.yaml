# CV generation and validation defaults
# Owned by this file — do not duplicate in env.yaml or pipeline.yaml.
# Override any key in .env.yaml for environment-specific values.

cv:
  preset: europass
  generation:
    model: gemini-2.5-flash
    prompt_version: v1
  composition:
    summary:
      enabled: true
      style: concise
    education:
      enabled: true
      detail: compact
      include_institution: true
      include_major: true
      include_grade: false
      thesis:
        mode: "off"
        relevance_only: true
    experience:
      enabled: true
      require_achievements: true
      bullet_style: action_project_result
      detail: standard
    skills:
      enabled: true
      max_items: 12
      display_mode: grouped
    certifications:
      enabled: true
      display_mode: combined_with_skills
      max_items: 5
    projects:
      enabled: true
      detail: standard
    publications:
      enabled: false
      detail: compact
    languages:
      enabled: true
      detail: compact
  content_rules:
    emphasize_required_skills: true
    align_jd_terminology: true
    evidence_grounded_only: true
  validation:
    max_pages: 2
