# @architecture
# owner: cv_system
# features:
#   - cv_system
# stages:
#   - ranking
#   - cv_analysis
# capabilities:
#   - cv_system.fit-gate-resolution
# role: config
# canonical: true

ranking_policy:
  policy_version: ranking-v2
  normalizer_version: absolute-fit-v1
  active_baseline_mode: holistic_ai_only
  baseline_weights:
    holistic_ai_fit: 1.0
    structured_fit: 0.0
  structured_factor_weights:
    must_have_match: 0.30
    title_relevance: 0.20
    seniority_fit: 0.15
    declared_preference_fit: 0.15
    location_fit: 0.10
    language_fit: 0.10
  declared_preference_component_weights:
    domain: 0.50
    role_family: 0.30
    work_mode: 0.20
  missing_value_defaults:
    holistic_ai_fit: 0.0
    must_have_match: 0.5
    title_relevance: 0.5
    seniority_fit: 0.5
    declared_preference_fit: 0.5
    location_fit: 0.5
    language_fit: 0.5
  fit_label_thresholds:
    strong: 0.70
    stretch: 0.40
  label_migration_gate:
    maximum_total_label_migration_rate: 0.10
    maximum_strong_skip_crossings: 0
