# @architecture
components:
  control_plane:
    source_globs:
      - src/fitcv_cp/app.py
      - src/fitcv_cp/templates/**
    forbidden_import_prefixes:
      - fitcv_cp.worker_job
  orchestration:
    source_globs:
      - src/fitcv_cp/worker_job.py
      - src/fitcv_cp/queue.py
    forbidden_import_prefixes: []
  evidence_contract:
    source_globs:
      - src/fitcv/pipeline.py
    forbidden_import_prefixes:
      - fitcv_cp.
  telemetry:
    source_globs:
      - src/fitcv_cp/reporter.py
    forbidden_import_prefixes:
      - fitcv.pipeline
  data_plane:
    source_globs:
      - src/fitcv_cp/bq_store.py
    forbidden_import_prefixes:
      - fitcv.pipeline
