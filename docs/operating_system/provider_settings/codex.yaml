provider: codex
schema_version: 1
hooks:
  enabled: true
  events:
    task_start:
      enabled: false
      provider_event: Start
      blocking: false
      timeout_seconds: 60
      commands: []
    task_end:
      enabled: true
      provider_event: Stop
      blocking: true
      timeout_seconds: 60
      commands:
        - python scripts/hooks/run_validator.py --fast
    error:
      enabled: false
      provider_event: Error
      blocking: false
      timeout_seconds: 60
      commands: []
    pre_tool:
      enabled: false
      provider_event: PreTool
      blocking: false
      timeout_seconds: 60
      commands: []
    post_tool:
      enabled: false
      provider_event: PostTool
      blocking: false
      timeout_seconds: 60
      commands: []
