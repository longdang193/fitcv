rule_filter:
  stage_id: rule_filter
  name: Rule Filter
  summary: Apply deterministic eligibility checks to enriched jobs and split them into passed and rejected sets before retrieval and ranking begin.
  boundaries:
    - deterministic pass/reject ownership belongs to this stage
    - reject reasons should be finalized here
    - later stages should only consider the passed set as retrieval-eligible
  inputs:
    - enriched job rows
    - deterministic filter and policy settings
  outputs:
    - passed jobs
    - rejected jobs
    - reject reasons
    - bounded `stage_transition_artifacts.rule_filter` runtime block with input, output, and changed-state samples
  depends_on:
    - enrich
  primary_features:
    - trigger_run_management
  related_features:
    - inspection_debugging
  refs:
    docs: []
    spec:
      - docs/superpowers/specs/2026-03-31-stage-contract-docs-adoption-design.md
      - docs/superpowers/specs/2026-03-31-stage-transition-artifacts-design.md
      - docs/superpowers/specs/2026-04-01-richer-stage-artifacts-design.md
    plan:
      - docs/superpowers/plans/2026-03-31-stage-transition-artifacts-implementation.md
      - docs/superpowers/plans/2026-04-01-richer-stage-artifacts-implementation.md
    history: []
  keywords:
    - rule filter
    - eligibility
    - reject reasons
    - deterministic gate
