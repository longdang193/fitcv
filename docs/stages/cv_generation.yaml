cv_generation:
  stage_id: cv_generation
  name: CV Generation
  summary: Convert ranked jobs and grounded evidence into accepted or rejected CV artifacts through evidence shaping, generation, validation, and repair-aware acceptance logic.
  boundaries:
    - ranked jobs and grounded evidence enter and accepted or rejected CV artifacts leave
    - validation and repair ownership belongs to this stage
    - final CV acceptance, skip, or failure outcomes should be explainable here
  inputs:
    - ranked jobs
    - grounded evidence and gap explanation inputs
    - CV generation and validation settings
  outputs:
    - structured CV artifacts
    - rendered markdown CVs
    - validation and repair outcomes
    - final CV generation status
    - bounded `stage_transition_artifacts.cv_generation` runtime block with input, output, and changed-state samples
  depends_on:
    - ranking
  primary_features:
    - cv_system
  related_features:
    - inspection_debugging
    - trigger_run_management
  refs:
    docs: []
    spec:
      - docs/superpowers/specs/2026-03-31-stage-contract-docs-adoption-design.md
      - docs/superpowers/specs/2026-03-31-stage-transition-artifacts-design.md
      - docs/superpowers/specs/2026-04-01-richer-stage-artifacts-design.md
    plan:
      - docs/superpowers/plans/2026-03-31-stage-transition-artifacts-implementation.md
      - docs/superpowers/plans/2026-04-01-richer-stage-artifacts-implementation.md
    history: []
  keywords:
    - cv generation
    - validation
    - repair
    - structured cv
