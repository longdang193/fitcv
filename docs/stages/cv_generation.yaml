cv_generation:
  stage_id: cv_generation
  name: CV Generation
  summary: Convert generation-ready CV-analysis records into accepted or rejected CV artifacts through writing, hybrid analysis-grounded validation, repair, and persistence without recomputing analysis or reselecting evidence by default.
  boundaries:
    - cv-analysis-ready jobs enter and accepted or rejected CV artifacts leave
    - generation, validation, repair, and persistence ownership belong to this stage
    - evidence retrieval, gap analysis, and fit-gate ownership do not belong to this stage
  inputs:
    - generation-ready analysis records
    - selected grounded evidence and gap explanation inputs prepared by `cv_analysis`
    - CV generation and validation settings
  outputs:
    - structured CV artifacts
    - rendered markdown CVs
    - validation and repair outcomes
    - final CV generation status
    - bounded `stage_transition_artifacts.cv_generation` runtime block with input, output, and changed-state samples, including bounded upstream `cv_analysis` inputs, selected evidence context, and hybrid validation provenance for debugging
  depends_on:
    - cv_analysis
  primary_features:
    - cv_system
  related_features:
    - inspection_debugging
    - trigger_run_management
  refs:
    docs: []
    spec:
      - docs/superpowers/specs/2026-03-31-stage-contract-docs-adoption-design.md
      - docs/superpowers/specs/2026-03-31-stage-transition-artifacts-design.md
      - docs/superpowers/specs/2026-04-01-richer-stage-artifacts-design.md
      - docs/superpowers/specs/2026-04-03-14-40-cv-analysis-and-generation-split-spec.md
      - docs/superpowers/specs/2026-04-03-18-20-cv-generation-analysis-aware-evidence-consumption-spec.md
      - docs/superpowers/specs/2026-04-03-19-10-cv-generation-hybrid-analysis-grounding-validation-spec.md
    plan:
      - docs/superpowers/plans/2026-03-31-stage-transition-artifacts-implementation.md
      - docs/superpowers/plans/2026-04-01-richer-stage-artifacts-implementation.md
      - docs/superpowers/plans/2026-04-03-14-55-cv-analysis-and-generation-split-plan.md
      - docs/superpowers/plans/2026-04-03-18-35-cv-generation-analysis-aware-evidence-consumption-plan.md
      - docs/superpowers/plans/2026-04-03-19-25-cv-generation-hybrid-analysis-grounding-validation-plan.md
    history: []
  keywords:
    - cv generation
    - validation
    - repair
    - structured cv
