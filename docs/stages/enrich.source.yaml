stage_id: enrich
name: Enrich
summary: Filter normalized jobs through pre-enrichment global checks, then enrich surviving jobs into a shared downstream contract with canonical skills, actual geography, language requirements, and reuse provenance.
boundaries:
  - normalized jobs enter and enriched job rows leave
  - pre-enrichment global filter ownership belongs to this stage in the current runtime flow
  - extraction prompt text and metadata are centrally managed via the prompt registry; bounded user guidance is inserted before immutable JSON/schema instructions, while enrich keeps ownership of schemas, parsing, and post-processing
  - shared `llm_runtime` owns route resolution, credentials, provider transport, wire compatibility, normalized operational failures, runtime provenance, and the only persistable per-call evidence projection; enrich owns extraction meaning, parsing, normalization, merge, retry, batching, and row shape
  - canonical downstream skill fields are limited to `required_skills` and `preferred_skills`, and are represented as canonical skill entities plus flattened canonical skill labels
  - Canonical `actual_location` is geography and remains distinct from `location_type` work mode
  - Canonical `language_requirements` is a first-class requirement contract, and language phrases are excluded from canonical skill entities
  - extraction versions participate in enrich-contract fingerprinting so incompatible location/language facts are not reused
  - manual staged runs may attach a run-scoped synonym overlay after this stage and before continuing into `rule_filter`
  - enrich reuse is decided before LLM invocation from normalized raw-job fingerprints plus the effective enrich-contract fingerprint
  - downstream scoring and CV work should rely on the enriched contract rather than raw input shape
inputs:
  - normalized job rows
  - pre-enrichment global filter settings from runtime config
outputs:
  - bounded `stage_transition_artifacts.enrich` runtime block with input, output, and changed-state samples
  - enrich prompt provenance, fresh-vs-reused counts, and a stage-neutral `llm_runtime_summary`; only fresh runtime calls emit ordered `llm_runtime_observations`
  - enrich-stage mapping suggestions for review/debug export
  - enriched job rows
  - optional enrich-checkpoint upload of a run-scoped synonym overlay for downstream matching
  - optional manual checkpoint payloads that can resume downstream rule filtering without rerunning normalize/enrich
  - pre-enrichment rejects with reasons
  - raw job fields plus canonical skill outputs for `required_skills` and `preferred_skills`
  - raw-job and enrich-contract fingerprint fields plus `enrich_reuse_status` provenance on enriched rows
  - versioned `actual_location` and `language_requirements` canonical facts with extraction status
depends_on:
  - normalize
primary_features:
  - cv_system
related_features:
  - trigger_run_management
  - inspection_debugging
