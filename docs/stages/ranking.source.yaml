stage_id: ranking
name: Ranking
summary: Score shortlist candidates through one exact ranking-v2 policy, preserve six absolute structured-factor diagnostics, derive the authoritative baseline fit label, and emit deterministic canonical ranking rows plus versioned artifacts for downstream consumers.
boundaries:
  - shortlist candidates enter and ranked jobs leave
  - ranking owns `baseline_fit`, `baseline_fit_label`, `baseline_rank`, total ordering, and the ranking contract fingerprint
  - shared `llm_runtime` owns route resolution, credentials, provider transport, wire compatibility, normalized operational failures, runtime provenance, and persistable call evidence; ranking owns prompt meaning, scalar parsing, factor algebra, label derivation, ordering, and row shape
  - '`config/policy/ranking.yaml` is the sole mutable ranking-policy owner; code does not own numeric fallbacks'
  - location and language consume Phase 1 absolute factor projections; hard-gated or disabled factors are excluded once from effective structured weights
  - vector evidence is shortlist provenance only and cannot affect baseline score, label, fingerprint, or tie order
  - completed-run export may freeze evidence-complete scored rows into `decision_feedback_source_v1`; ratings never feed Phase 4 ranking
  - Phase 5 consumes immutable rating evidence through a pure preference compiler; compiler edges remain outside ranking runtime and do not alter labels or order
  - canonical writes exclude legacy `final_*`, model-authored label, and ambiguous `preference_fit` authority
inputs:
  - holistic AI score and diagnostics
  - scoring shortlist
  - six canonical structured-factor inputs
  - validated ranking and eligibility policies
outputs:
  - '`stage_transition_artifacts.ranking.decision_summary.reuse_metrics` with exact-match AI-score reuse counts and fresh counts over scored inputs'
  - authoritative `baseline_fit_label` values (`strong`, `stretch`, `skip`) that downstream stages preserve as upstream truth
  - bounded `stage_transition_artifacts_v8.ranking` runtime block with exact policy/fingerprint data, configured/effective weights, normalizers, missing/coverage/contribution summaries, label distribution, migration summary, reuse metrics, and canonical samples
  - canonical ranked jobs with `baseline_fit`, `baseline_fit_label`, `baseline_rank`, factor records, policy versions, and `ranking_contract_fingerprint`
  - immutable normalized-vector and baseline evidence for `results_job_ledger_v4` decision-feedback alternatives
  - optional manual checkpoint payloads that can resume `cv_analysis` from ranked jobs without recomputing earlier stages
  - ordered `llm_runtime_observations` for actual ranking calls plus a stage-neutral runtime summary; exact reuse emits no new runtime evidence
  - row-level `ai_score_reuse_status` and `ai_score_input_fingerprint` in ranking outputs and exports
  - scored ranking inputs
depends_on:
  - shortlist
primary_features:
  - cv_system
related_features:
  - inspection_debugging
