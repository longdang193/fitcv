stage_id: cv_analysis
name: CV Analysis
summary: Prepare ranked jobs for writing by merging enriched context, retrieving and scoring candidate evidence across required-skill, role, domain, and responsibility channels, selecting one bounded final evidence bundle, computing grounded gap summaries, and resolving the fit gate that determines whether `cv_generation` should run.
boundaries:
  - ranked jobs enter and stage-owned `ready_for_generation`, `blocked_by_reranker_fit`, `skipped_fit_gate`, or `analysis_failed` records leave
  - evidence retrieval, final evidence selection, gap analysis, and fit-gate ownership belong to this stage
  - "`fitcv.agentic_cv_analysis.analyze_ranked_job` is the sole per-job business entrypoint and canonical record owner"
  - "pipeline orchestration may locate reuse candidates, persist records, and emit observations, but it does not recreate analysis decisions"
  - this stage does not generate or persist final CV artifacts
inputs:
  - candidate profile
  - enriched job context
  - evidence-selection settings
  - gap-analysis settings
  - ranked jobs
  - semantic-alignment settings
outputs:
  - blocked_by_reranker_fit, skipped_fit_gate, and analysis_failed outcomes
  - persisted cv-analysis records
  - ready_for_generation records with selected evidence and gap payloads
  - stage-owned quality and reuse metrics
depends_on:
  - ranking
primary_features:
  - cv_system
related_features:
  - inspection_debugging
  - settings_system
  - trigger_run_management
