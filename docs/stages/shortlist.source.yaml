stage_id: shortlist
name: Shortlist
summary: Turn passed jobs with valid embeddings into one deterministic cosine-ranked production shortlist, while keeping bounded below-cutoff audit evidence artifact-only and exposing retrieval coverage, cutoff, and anomaly diagnostics.
boundaries:
  - eligible passed jobs enter here and production shortlist rows with real cosine evidence leave here
  - audit rows remain inside the shortlist stage artifact and never enter checkpoint, persistence, AI scoring, ranking, exports, or labels
  - full-run and continuation paths use the same production row and diagnostics contracts
inputs:
  - candidate query text, bounded candidate-query components, and one reusable candidate query embedding derived from the profile evidence surface
  - passed jobs
  - vector search results
outputs:
  - '`stage_transition_artifacts.stages.shortlist.decision_summary.quality_metrics` copied from retrieval diagnostics'
  - bounded candidate-query context for the single retrieval vector used in this stage
  - bounded shortlist candidate-query components and candidate-query reuse provenance for debugging
  - fresh-versus-reused embedding provenance for passed jobs
  - missing, invalid, duplicate, coverage, cutoff, and audit diagnostics
  - raw row versus raw unique-job retrieval counts
  - raw vector hits
  - scoring shortlist
  - versioned `stage_transition_artifacts.stages.shortlist` runtime block with production retrieval rows, production shortlist, and bounded deterministic audit sample
depends_on:
  - rule_filter
primary_features:
  - inspection_debugging
related_features:
  - trigger_run_management
