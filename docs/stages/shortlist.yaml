shortlist:
  stage_id: shortlist
  name: Shortlist
  summary: Turn passed jobs into a retrieval-aware scoring shortlist by reusing unchanged job-summary embeddings when safe, searching only the latest active embedding row per canonical job URL with the deterministic candidate query vector actually used for retrieval, then capturing raw hits, shortlist transitions, and any backfill needed before scoring.
  boundaries:
    - raw retrieval output enters here and the scoring shortlist leaves here
    - this stage owns the distinction between raw vector hits and the later scoring shortlist
    - shortlist transition reasons should be explainable here rather than inferred later
  inputs:
    - passed jobs
    - deterministic candidate query text or retrieval query context
    - vector search results
  outputs:
    - raw vector hits
    - scoring shortlist
    - shortlist transition reasons including any backfill
    - raw row versus raw unique-job retrieval counts
    - fresh-versus-reused embedding provenance for passed jobs
    - bounded candidate-query context for the single retrieval vector used in this stage
    - bounded `stage_transition_artifacts.shortlist` runtime block with input, output, and changed-state samples
  depends_on:
    - rule_filter
  primary_features:
    - inspection_debugging
  related_features:
    - trigger_run_management
  refs:
    docs: []
    spec:
      - docs/superpowers/specs/2026-03-31-stage-contract-docs-adoption-design.md
      - docs/superpowers/specs/2026-03-31-stage-transition-artifacts-design.md
      - docs/superpowers/specs/2026-04-01-richer-stage-artifacts-design.md
      - docs/superpowers/specs/2026-04-02-23-10-shortlist-latest-only-persistent-embeddings-spec.md
      - docs/superpowers/specs/2026-04-03-00-40-shortlist-embedding-reuse-via-structured-signature-spec.md
    plan:
      - docs/superpowers/plans/2026-03-31-stage-transition-artifacts-implementation.md
      - docs/superpowers/plans/2026-04-01-richer-stage-artifacts-implementation.md
      - docs/superpowers/plans/2026-04-02-23-25-shortlist-latest-only-persistent-embeddings-plan.md
      - docs/superpowers/plans/2026-04-03-00-55-shortlist-embedding-reuse-via-structured-signature-plan.md
    history: []
  keywords:
    - shortlist
    - vector search
    - retrieval
    - backfill
    - embeddings
    - reuse
