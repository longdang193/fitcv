enrich:
  stage_id: enrich
  name: Enrich
  summary: Filter normalized jobs through pre-enrichment global checks, then enrich surviving jobs into a shared raw-plus-canonical downstream contract used by later stages.
  boundaries:
    - normalized jobs enter and enriched job rows leave
    - pre-enrichment global filter ownership belongs to this stage in the current runtime flow
    - canonical downstream fields such as required skills, canonical skill companions, raw scalar companions, job family, and years fields become usable here
    - downstream scoring and CV work should rely on the enriched contract rather than raw input shape
  inputs:
    - normalized job rows
    - pre-enrichment global filter settings from runtime config
  outputs:
    - enriched job rows
    - raw-plus-canonical downstream job fields
    - enrich-stage mapping suggestions for review/debug export
    - pre-enrichment rejects with reasons
    - bounded `stage_transition_artifacts.enrich` runtime block with input, output, and changed-state samples
  depends_on:
    - normalize
  primary_features:
    - cv_system
  related_features:
    - trigger_run_management
    - inspection_debugging
  refs:
    docs: []
    spec:
      - docs/superpowers/specs/2026-03-31-stage-contract-docs-adoption-design.md
      - docs/superpowers/specs/2026-03-31-stage-transition-artifacts-design.md
      - docs/superpowers/specs/2026-04-01-richer-stage-artifacts-design.md
    plan:
      - docs/superpowers/plans/2026-03-31-stage-transition-artifacts-implementation.md
      - docs/superpowers/plans/2026-04-01-richer-stage-artifacts-implementation.md
    history: []
  keywords:
    - enrich
    - pre-enrichment
    - required skills
    - years experience
