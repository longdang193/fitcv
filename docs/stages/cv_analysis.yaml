cv_analysis:
  name: CV Analysis
  summary: 'Prepare ranked jobs for writing by merging enriched context, retrieving and scoring candidate evidence across required-skill, role, domain, and responsibility channels, selecting one bounded final evidence bundle, computing grounded gap summaries, and resolving the fit gate that determines whether `cv_generation` should run.

    '
  boundaries:
  - ranked jobs enter and generation-ready or analysis-rejected records leave
  - evidence retrieval, final evidence selection, gap analysis, and fit-gate ownership belong to this stage
  - this stage does not generate or persist final CV artifacts
  inputs:
  - ranked jobs
  - enriched job context
  - candidate profile
  - evidence-selection settings
  - semantic-alignment settings
  - gap-analysis settings
  outputs:
  - persisted cv-analysis records
  - generation-ready jobs with selected evidence and gap payloads
  - skipped-fit-gate or analysis-failed outcomes
  - stage-owned quality and reuse metrics
  depends_on:
  - ranking
  primary_features:
  - cv_system
  related_features:
  - inspection_debugging
  - settings_system
  - trigger_run_management
  refs:
    spec:
    - docs/superpowers/archive/specs/2026-04-03-14-40-cv-analysis-and-generation-split-spec.md
    - docs/superpowers/archive/specs/2026-04-03-17-30-cv-analysis-evidence-selection-upgrade-spec.md
    - docs/superpowers/archive/specs/2026-04-03-19-10-cv-generation-hybrid-analysis-grounding-validation-spec.md
    plan:
    - docs/superpowers/archive/plans/2026-04-03-14-55-cv-analysis-and-generation-split-plan.md
    - docs/superpowers/archive/plans/2026-04-03-17-45-cv-analysis-evidence-selection-upgrade-plan.md
    - docs/superpowers/archive/plans/2026-04-03-19-25-cv-generation-hybrid-analysis-grounding-validation-plan.md
  keywords:
  - cv analysis
  - evidence retrieval
  - evidence selection
  - fit gate
