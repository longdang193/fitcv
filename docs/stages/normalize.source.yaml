stage_id: normalize
name: Normalize
summary: Normalize raw run inputs into a stable job list, preserve provider-native source-location evidence, apply deduplication, and hand surviving rows to downstream enrichment and filtering.
boundaries:
  - raw job input ends here and normalized job rows begin here
  - deduplication ownership belongs to this stage
  - provider-native geography is adapted to `source_location` here without geocoding, alias expansion, or work-mode inference
  - downstream stages should only see the normalized, deduplicated candidate job pool produced here
inputs:
  - raw job payloads from file, path, or pasted JSON inputs
  - run-level input source context from trigger handling
outputs:
  - bounded `stage_transition_artifacts.normalize` runtime block with input, output, and changed-state samples
  - deduplicated job decisions
  - normalized job rows
  - provider-neutral `source_location` evidence carried with normalized rows
depends_on: []
primary_features:
  - trigger_run_management
related_features:
  - cv_system
  - inspection_debugging
