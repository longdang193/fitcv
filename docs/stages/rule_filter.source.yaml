stage_id: rule_filter
name: Rule Filter
summary: Apply deterministic checks plus symmetric location/language eligibility policy, then split enriched jobs into passed and rejected sets before retrieval and ranking begin.
boundaries:
  - deterministic pass/reject ownership belongs to this stage
  - reject reasons should be finalized here
  - canonical enrich outputs should be consumed here instead of reinterpreting raw extracted phrases when available
  - location and language use one evaluator-result envelope and one `disabled | ranking_only | gate_required` projection table
  - only confirmed `gate_required` failures reject; unknown and not-applicable factor states remain eligible with diagnostics
  - later stages should only consider the passed set as retrieval-eligible
inputs:
  - candidate fit context built from profile preferences and language inventory
  - canonical `eligibility_policy` from `config/policy/eligibility.yaml`
  - deterministic filter and policy settings
  - effective skill synonym map, which may include a run-scoped overlay uploaded after `enrich` in manual staged mode
  - enriched job rows
outputs:
  - bounded `stage_transition_artifacts.rule_filter` runtime block with input, output, and changed-state samples
  - full `fit_factor_results`, `eligibility_decision`, and policy fingerprint on passed and rejected rows
  - non-blocking marks for failed but unselected deterministic checks
  - optional manual checkpoint payloads that can resume shortlist/ranking from the passed-job set
  - passed jobs
  - reject reasons
  - rejected jobs
depends_on:
  - enrich
primary_features:
  - cv_system
  - trigger_run_management
related_features:
  - inspection_debugging
