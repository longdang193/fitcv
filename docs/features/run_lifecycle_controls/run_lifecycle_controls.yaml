run_lifecycle_controls:
  name: Run Lifecycle Controls
  status: active
  type: add
  summary: Admins can stop queued, running, or paused `awaiting_continue` runs, archive or unarchive completed runs, apply lifecycle actions in bulk from the runs list, and rely on a server-owned max-runtime timeout guard whose diagnostics distinguish active runtime from Stage by Stage manual-wait time.
  owner: fitcv_cp
  domains:
  - admin_ui
  - run_orchestration
  depends_on:
  - admin_control_plane_core
  capabilities:
  - Cancel queued runs directly from the queue via RQ
  - Cooperative cancellation at safe checkpoints for running jobs
  - Direct cancellation of paused manual runs in `awaiting_continue`
  - Stale cancellation repair endpoint
  - State-aware max-runtime timeout handling for queued, running, cancelling, and paused manual runs
  - Timeout copy now distinguishes queue wait, active runtime, and Stage by Stage manual-wait time
  - Archive and unarchive terminal runs
  - Batch cancel, archive, and unarchive endpoints with explicit processed/skipped summaries
  - Full audit trail in pipeline_run_events
  refs:
    docs: []
    spec:
    - docs/superpowers/archive/specs/2026-03-26-run-lifecycle-controls-design.md
    plan:
    - docs/superpowers/archive/plans/2026-03-26-run-lifecycle-controls-implementation.md
    history:
    - docs/features/run_lifecycle_controls/history.md
  keywords:
  - cancel
  - stop
  - archive
  - lifecycle
  - cooperative cancellation
