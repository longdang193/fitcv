bounded_parallel_enrichment:
  name: Bounded Parallel Enrichment
  version: 1.0.0
  status: active
  type: add
  summary: Enrichment runs in bounded parallel batches with admin-controlled concurrency settings.
  owner: fitcv
  domains:
    - pipeline
    - api_optimization
  depends_on:
    - pipeline_performance
  capabilities:
    - enrichment_batch_size setting
    - enrichment_concurrency setting
    - Pre-enrichment global filters run first
    - Conservative defaults (batch_size=10, concurrency=1)
    - Deterministic output order
    - Per-job failure isolation
  refs:
    docs: []
    spec:
