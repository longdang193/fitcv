cv_system:
  name: CV System
  version: 1.3.0
  status: active
  type: add
  summary: CV generation uses a structured preset-based configuration, and the shortlist stage now keeps a strict job-level contract from passed jobs to scoring shortlist rows with unique-job retrieval counts and clearer shortlist diagnostics.
  owner: fitcv
  domains:
    - pipeline
    - cv_generation
  depends_on:
    - admin_control_plane_core
  capabilities:
    - Preset registry for template binding
    - CV composition model (visibility, detail level per section)
    - Content rules (evidence_grounded_only, JD terminology alignment)
    - CV validation against composition rules
    - Admin settings UI for CV configuration
    - Compatibility projection for flat-to-nested migration
    - Single-chunk `job_summary` shortlist retrieval for jobs
    - Shortlist scoring membership stays grounded in `passed_jobs`
    - Latest active `job_summary` embedding row per `job_url` is used for shortlist retrieval
    - Shortlist ranks and counts now reflect unique jobs rather than duplicate embedding rows
  refs:
    docs:
      - docs/FitCV-pipeline.md
    spec:
      - docs/superpowers/specs/2026-03-27-preset-based-cv-composition-design.md
      - docs/superpowers/specs/2026-03-27-admin-editable-cv-generation-settings-design.md
      - docs/superpowers/specs/2026-04-01-11-30-shortlist-contract-cleanup-spec.md
    plan:
      - docs/superpowers/plans/2026-03-27-centralized-cv-generation-config-implementation.md
      - docs/superpowers/plans/2026-03-27-preset-based-cv-config-migration-implementation.md
      - docs/superpowers/plans/2026-03-27-admin-editable-cv-generation-settings-implementation.md
      - docs/superpowers/plans/2026-03-27-preset-based-admin-cv-settings-implementation.md
      - docs/superpowers/plans/2026-04-01-11-45-shortlist-contract-cleanup-plan.md
    history:
      - docs/features/cv_system/history.md
  keywords:
    - cv
    - resume
    - europass
    - preset
    - composition
    - cv generation
