feature_id: cv_system
name: CV System
status: active
type: add
summary: Own canonical candidate-job fit facts and eligibility through grounded post-ranking analysis and CV generation, with symmetric policy projection, shared runtime adapters, canonical evidence, and stage-neutral traces.
invariants: []
domains:
  - cv_generation
  - eligibility
  - pipeline
depends_on:
  - admin_control_plane_core
capabilities:
  - capability_id: cv_system.location-language-eligibility
    statement: Preserve canonical location and language facts, evaluate both through one symmetric factor algebra, and apply one versioned eligibility policy before shortlist and ranking.
    state: active
  - capability_id: cv_system.analysis-evidence-selection
    statement: 'Retrieve, score, and select one bounded evidence bundle for grounded downstream CV writing.

      '
    state: active
  - capability_id: cv_system.fit-gate-resolution
    statement: 'Resolve whether a ranked job is eligible to continue from analysis into CV generation.

      '
    state: active
  - capability_id: cv_system.structured-cv-generation
    statement: 'Generate the structured CV artifact and rendered markdown output from the selected evidence bundle.

      '
    state: active
  - capability_id: cv_system.analysis-grounded-validation
    statement: 'Validate hard facts and softer role or domain claims against selected analysis evidence before accepting a CV artifact.

      '
    state: active
  - capability_id: cv_system.header-placeholder-repair
    statement: 'Reject unresolved candidate-name placeholders and allow one deterministic header-only repair when a real name is available.

      '
    state: active
  - capability_id: cv_system.stage-artifact-diagnostics
    statement: 'Emit stage-owned diagnostics, quality metrics, canonical runtime evidence, and stage-neutral traces for `cv_analysis` and `cv_generation`.

      '
    state: active
  - capability_id: cv_system.vector-only-shortlist
    statement: Produce one deterministic cosine-ranked production shortlist from real embedding evidence and keep bounded below-cutoff audit rows artifact-only across full-run and continuation paths.
    state: active
  - capability_id: cv_system.exact-match-late-stage-reuse
    statement: 'Reuse exact-match ranking AI-score rows and cv-analysis outputs when stage-owned inputs and contracts still match.

      '
    state: active
  - capability_id: cv_system.config-owned-generation-contract
    statement: 'Keep generation meaning under one structured-write contract while direct and LangGraph adapters share central runtime routing.

      '
    state: active
stage_participation:
  - stage_id: normalize
    role: supporting
    capability_ids:
      - cv_system.location-language-eligibility
  - stage_id: enrich
    role: supporting
    capability_ids:
      - cv_system.analysis-evidence-selection
      - cv_system.location-language-eligibility
  - stage_id: rule_filter
    role: primary
    capability_ids:
      - cv_system.location-language-eligibility
  - stage_id: ranking
    role: supporting
    capability_ids:
      - cv_system.exact-match-late-stage-reuse
      - cv_system.fit-gate-resolution
  - stage_id: shortlist
    role: primary
    capability_ids:
      - cv_system.stage-artifact-diagnostics
      - cv_system.vector-only-shortlist
  - stage_id: cv_analysis
    role: primary
    capability_ids:
      - cv_system.analysis-evidence-selection
      - cv_system.exact-match-late-stage-reuse
      - cv_system.fit-gate-resolution
      - cv_system.stage-artifact-diagnostics
  - stage_id: cv_generation
    role: primary
    capability_ids:
      - cv_system.analysis-grounded-validation
      - cv_system.config-owned-generation-contract
      - cv_system.header-placeholder-repair
      - cv_system.stage-artifact-diagnostics
      - cv_system.structured-cv-generation
