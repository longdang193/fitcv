pipeline_performance:
  name: Pipeline Performance
  version: 1.4.0
  status: active
  type: modify
  summary: Reduced API costs by filtering jobs before enrichment, using reliable structured output parsing, centralizing enrich prompt management, and reusing unchanged enrich results safely via raw-job and enrich-contract fingerprints.
  owner: fitcv
  domains:
    - pipeline
    - api_optimization
  depends_on: []
  capabilities:
    - Pre-enrichment global job filters (applications_count_max, max_age_days)
    - Explicit rejection reasons in rule_filter_results
    - Gemini structured output with response_schema and Pydantic
    - Fallback path for unparseable responses
    - Enrich extraction prompt text now comes from a centralized prompt registry with config-selected prompt IDs
    - Enrich-stage raw-plus-canonical semantic companions for repeated downstream fields
    - Canonical skill companion lists and entity payloads for required/preferred skills
    - Enrich-stage mapping suggestion capture for review/debug surfaces
    - Fingerprint-based enrich-result reuse happens before LLM enrichment using normalized raw-job inputs
    - Enrich-contract fingerprinting invalidates reuse automatically when prompt/model/schema behavior changes
    - Shared `structured_jobs` reuse lookup avoids redundant enrich calls while only fresh rows are upserted back into the shared table
  refs:
    docs:
      - docs/FitCV-pipeline.md
    spec:
      - docs/superpowers/specs/2026-03-26-cheap-first-pipeline-narrowing-design.md
      - docs/superpowers/specs/2026-03-26-gemini-structured-output-enrichment-design.md
      - docs/superpowers/specs/2026-04-02-19-10-central-prompt-registry-spec.md
      - docs/superpowers/specs/2026-04-02-23-55-enrich-reuse-via-raw-job-fingerprint-spec.md
    plan:
      - docs/superpowers/plans/2026-03-26-global-job-filters-implementation.md
      - docs/superpowers/plans/2026-03-26-cheap-first-pipeline-narrowing-implementation.md
      - docs/superpowers/plans/2026-03-26-gemini-structured-output-enrichment-implementation.md
      - docs/superpowers/plans/2026-04-02-19-25-central-prompt-registry-plan.md
      - docs/superpowers/plans/2026-04-03-00-10-enrich-reuse-via-raw-job-fingerprint-plan.md
    history:
      - docs/features/pipeline_performance/history.md
  keywords:
    - performance
    - enrichment
    - structured output
    - global filters
    - api cost
    - parallel enrichment
    - reuse
    - fingerprint
