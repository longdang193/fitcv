trigger_run_management:
  name: Trigger & Run Management
  version: 1.9.0
  status: active
  type: add
  summary: "Admins can trigger runs via path reference, file upload, or pasted JSON — inspect runs from a status-aware list page — and export run results including structured CV data, explicit decision-chain fields, settings-used snapshots, richer stage-transition artifacts, shortlist debug context with raw-vs-scoring shortlist visibility, and clearer pipeline outcomes for non-ranked and fit-gated jobs when available."
  owner: fitcv_cp
  domains:
    - admin_ui
    - run_orchestration
  depends_on:
    - admin_control_plane_core
  primary_stage: normalize
  stages:
    - normalize
    - enrich
    - rule_filter
    - shortlist
  capabilities:
    - Runs list page with status badges, timestamps, and per-run action buttons
    - "Archive filter: Active / All / Archived"
    - "Three job-input modes: path, upload, paste"
    - "Three candidate-profile modes: default_config, upload, paste"
    - Server-side mode resolution
    - Canonical snapshot capture for pasted and uploaded inputs
    - CV results banner on run detail
    - CV downloads
    - Run results JSON export
    - Settings-used JSON export from run detail for succeeded runs when available
    - Stage-transition artifacts JSON export from run detail for succeeded runs when available
    - Timeline-linked stage-slice JSON downloads for recognized stage-boundary events
    - Stage-slice downloads now expose richer per-stage input, output, and changed-state samples instead of summary-only handoff blocks
    - CV-generation debug JSON export from run detail for succeeded runs when available
    - Run-results export includes structured CV data and CV generation metadata when available
    - Run-results export distinguishes non-ranked passed jobs as `not_shortlisted`, `shortlisted_not_scored`, or `scored_not_ranked`
    - Run-results export and run detail distinguish ranked jobs skipped by the Layer 4 fit gate as `ranked_skipped_fit_gate`
    - Run-results export includes shortlist debug context so `not_shortlisted` rows show whether the job URL was returned by vector search
    - Top-level shortlist debug distinguishes raw vector-search hits from the later scoring shortlist after any backfill
    - Run-results export exposes an explicit decision chain per job covering shortlist path, primary fit authority, CV attempt/skip, and validation outcome
    - Ranked jobs now use reranker fit as the sole post-filter authority for ranking and CV eligibility
    - Run detail enriched-jobs table shows a compact pipeline outcome label plus decision-chain detail in addition to filter pass/reject state
  refs:
    docs:
      - docs/fitcv-control-plane-setup.md
    spec:
      - docs/superpowers/specs/2026-03-25-runs-list-enhancements-design.md
      - docs/superpowers/specs/2026-03-25-admin-ux-improvements-design.md
      - docs/superpowers/specs/2026-03-25-cv-downloads-design.md
      - docs/superpowers/specs/2026-03-29-run-results-json-export-design.md
      - docs/superpowers/specs/2026-03-31-cv-generation-debug-snapshots-design.md
      - docs/superpowers/specs/2026-03-31-stage-transition-artifacts-design.md
      - docs/superpowers/specs/2026-03-31-timeline-linked-stage-artifact-downloads-design.md
      - docs/superpowers/specs/2026-04-01-richer-stage-artifacts-design.md
      - docs/superpowers/specs/2026-03-31-19-10-pipeline-decision-consistency-cleanup-spec.md
    plan:
      - docs/superpowers/plans/2026-03-25-runs-list-enhancements-implementation.md
      - docs/superpowers/plans/2026-03-25-admin-ux-improvements-implementation.md
      - docs/superpowers/plans/2026-03-25-cv-downloads-implementation.md
      - docs/superpowers/plans/2026-03-29-run-results-json-export-implementation.md
      - docs/superpowers/plans/2026-03-31-cv-generation-debug-snapshots-implementation.md
      - docs/superpowers/plans/2026-03-31-stage-transition-artifacts-implementation.md
      - docs/superpowers/plans/2026-03-31-timeline-linked-stage-artifact-downloads-implementation.md
      - docs/superpowers/plans/2026-04-01-richer-stage-artifacts-implementation.md
      - docs/superpowers/plans/2026-03-31-pipeline-decision-consistency-cleanup-implementation.md
    history:
      - docs/features/trigger_run_management/history.md
  keywords:
