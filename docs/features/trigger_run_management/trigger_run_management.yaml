  statement: Provide aggregate stage-boundary downloads, stage slices, and gated stage-owned exports only when the owning stage has been reached.
  state: active
- capability_id: trigger_run_management.synonym-overlay-inspection
  statement: Show active synonym-overlay state and snapshots from run detail inspection.
  state: active
- capability_id: trigger_run_management.run-results-export
  statement: Export job-centric results with structured CV metadata and compact outcome detail.
  state: active
- capability_id: trigger_run_management.shortlist-debug-exports
  statement: Show shortlist debug facts such as raw-hit visibility, raw-count separation, and retrieval-stage diagnostics.
  state: active
- capability_id: trigger_run_management.decision-chain-outcomes
  statement: Surface explicit per-job decision chains and compact pipeline-outcome labels in exports and inspection views.
  state: active
