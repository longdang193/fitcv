  statement: Support server-owned mode resolution for `Run All` and `Stage by Stage`.
  state: active
- capability_id: trigger_run_management.synonym-overlay-at-trigger
  statement: Allow both execution modes to snapshot a run-scoped synonym-overlay YAML during setup.
  state: active
- capability_id: trigger_run_management.shared-stage-progress
  statement: Persist shared reached-stage and completion progress for both execution modes.
  state: active
- capability_id: trigger_run_management.manual-checkpoints-and-continue
  statement: Persist stage-by-stage checkpoint payloads and allow paused runs to continue from the next pending stage.
  state: active
- capability_id: trigger_run_management.synonym-overlay-replacement
  statement: Allow paused manual runs to replace the run-scoped synonym overlay after enrich before continuing.
  state: active
- capability_id: trigger_run_management.run-health-surface
  statement: Show compact run-health diagnostics that combine stage quality and late-stage reuse visibility.
  state: active
- capability_id: trigger_run_management.run-owned-artifact-exports
  statement: Export run-scoped artifacts such as CV outputs, results, settings-used, CV debug, and artifact bundles.
  state: active
