settings_system:
  name: Settings System
  version: 2.8.0
  status: active
  type: add
  summary: Admins can view and edit pipeline tuning defaults through the admin UI, including richer ranking calibration surfaces and `cv_analysis` hybrid semantic-alignment controls, while baseline defaults now resolve from centralized YAML/config ownership instead of drifting as duplicated schema literals, persisted overrides still live in BigQuery, the canonical config room is organized into responsibility-based `config/runtime`, `config/policy`, and `config/taxonomy` subfolders, dormant CV content-rule toggles are no longer presented as live settings, and metadata-only CV fields such as `cv_prompt_version` and legacy `cv_template_path` are no longer exposed as active admin controls.
  owner: fitcv_cp
  domains:
    - admin_ui
    - pipeline_config
  depends_on:
    - admin_control_plane_core
  capabilities:
    - BigQuery-backed pipeline settings store
    - Settings schema registry
    - Retrieval settings
    - Timing and throttling settings
    - Global job filters
    - Ranking settings with six-feature sum-to-one validation
    - Explicit zero-weight semantics for supported ranking features
    - Ranking settings copy aligned to semantic role-alignment and weighted preference-alignment runtime semantics
    - Preference-fit subweights for domain, role-family, and location-type calibration
    - Fit-label threshold descriptions aligned to AI-reranker label calibration semantics
    - `cv_analysis` semantic-alignment enable/model controls
    - `cv_analysis` lexical-vs-semantic weight controls for responsibility and domain alignment
    - Validation that each `cv_analysis` lexical/semantic weight pair sums to `1.0`
    - CV generation settings
    - CV composition visibility settings
    - Warning-only CV max-pages validation setting
    - Metadata-only CV prompt/template fields retired from the active admin settings surface
    - Grouped form validation
    - Per-run overrides
    - Trigger-time effective settings snapshot
    - Admin settings defaults now hydrate from the loaded baseline config for supported paths instead of acting as a competing default store
    - Admin settings default hydration now follows the reorganized config-room layout while preserving flat-path compatibility during the migration window
  refs:
    docs:
      - docs/fitcv-control-plane-setup.md
    spec:
      - docs/superpowers/specs/2026-03-25-pipeline-settings-design.md
      - docs/superpowers/specs/2026-03-27-admin-editable-cv-generation-settings-design.md
      - docs/superpowers/specs/2026-03-27-preset-based-cv-composition-design.md
      - docs/superpowers/specs/2026-04-01-six-feature-ranking-reactivation-design.md
      - docs/superpowers/specs/2026-04-01-12-15-ranking-contract-drift-cleanup-spec.md
      - docs/superpowers/specs/2026-04-03-01-35-ranking-quality-tuning-spec.md
      - docs/superpowers/specs/2026-04-04-10-15-cv-analysis-semantic-alignment-upgrade-spec.md
      - docs/superpowers/specs/2026-04-04-16-20-config-centralization-audit-followup-spec.md
    plan:
      - docs/superpowers/plans/2026-03-25-pipeline-settings-implementation.md
      - docs/superpowers/plans/2026-03-27-centralized-cv-generation-config-implementation.md
      - docs/superpowers/plans/2026-03-27-preset-based-cv-config-migration-implementation.md
      - docs/superpowers/plans/2026-03-26-ranking-settings-grouped-forms-implementation.md
      - docs/superpowers/plans/2026-03-26-global-job-filters-implementation.md
      - docs/superpowers/plans/2026-04-01-six-feature-ranking-reactivation-implementation.md
      - docs/superpowers/plans/2026-04-01-12-25-ranking-contract-drift-cleanup-plan.md
      - docs/superpowers/plans/2026-04-03-01-50-ranking-quality-tuning-plan.md
      - docs/superpowers/plans/2026-04-04-10-30-cv-analysis-semantic-alignment-upgrade-plan.md
      - docs/superpowers/plans/2026-04-04-16-35-config-centralization-audit-followup-plan.md
    history:
      - docs/features/settings_system/history.md
  keywords:
