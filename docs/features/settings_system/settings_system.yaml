      - docs/superpowers/archive/specs/2026-04-03-01-35-ranking-quality-tuning-spec.md
      - docs/superpowers/archive/specs/2026-04-04-10-15-cv-analysis-semantic-alignment-upgrade-spec.md
      - docs/superpowers/archive/specs/2026-04-04-16-20-config-centralization-audit-followup-spec.md
    plan:
      - docs/superpowers/archive/plans/2026-03-25-pipeline-settings-implementation.md
      - docs/superpowers/archive/plans/2026-03-27-centralized-cv-generation-config-implementation.md
      - docs/superpowers/archive/plans/2026-03-27-preset-based-cv-config-migration-implementation.md
      - docs/superpowers/archive/plans/2026-03-26-ranking-settings-grouped-forms-implementation.md
      - docs/superpowers/archive/plans/2026-03-26-global-job-filters-implementation.md
