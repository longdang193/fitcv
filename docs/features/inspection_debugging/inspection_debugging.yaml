inspection_debugging:
  name: Inspection & Debugging
  status: active
  type: add
  summary: Admins can see what the pipeline did for a run, including shared stage progress for both `Run All` and `Stage by Stage`, paused staged checkpoints, enrich reuse provenance, selectable rule-filter marks, shortlist retrieval and embedding-reuse diagnostics, richer shortlist candidate-query components, explicit shortlist candidate-query reuse provenance, ranking contribution visibility and calibration surfaces, late-stage reuse diagnostics for `ranking` and `cv_analysis`, slimmer job-ledger exports, compact per-job `results.json` rows, stage-local artifacts, compact severity-based run health with explicit `Pending` vs `N/A`, stage-gated export availability, a job-ledger `results.json` split from bundled stage diagnostics, outcome-first artifact samples, stable normalize timeline ownership, aggregate-first timeline summaries, explicit separation between reranker-blocked rows and true analyzed-and-skipped `cv_analysis` outcomes, truthful reranker-blocked propagation into compact `results.json`
    decision chains and `cv-debug` omission accounting, multi-channel evidence-selection provenance, lexical-vs-semantic alignment detail, inputs used, generated CVs, explicit decision detail, hybrid validation provenance from deterministic and soft-claim grounding checks, canonicalized settings-used exports, clearer `cv-debug` coverage accounting, and prompt-id-based provenance for both ranking and the active structured-only `cv_generation` path.
  owner: fitcv_cp
  domains:
  - admin_ui
  - run_orchestration
  depends_on:
  - admin_control_plane_core
  primary_stage: cv_generation
  stages:
  - enrich
  - rule_filter
  - shortlist
  - ranking
  - cv_analysis
  - cv_generation
  capabilities:
  - capability_id: inspection_debugging.run-detail-page-with-3-tab-inspection-interface
    name: Run detail page with 3-tab inspection interface
  - capability_id: inspection_debugging.client-side-tab-switching
    name: Client-side tab switching
  - capability_id: inspection_debugging.filter-outcome-display-with-reasons-and-non-blocking-marks
    name: Filter outcome display with reasons and non-blocking marks
  - capability_id: inspection_debugging.pre-enrichment-rejects-visible-separately
    name: Pre-enrichment rejects visible separately
  - capability_id: inspection_debugging.immutable-snapshots-for-all-trigger-modes
    name: Immutable snapshots for all trigger modes
  - capability_id: inspection_debugging.run-detail-shows-execution-mode-plus-shared-last-completed-stage-and-completed-stage-progress-for-both-run-all-and-stage-by-stage
    name: Run detail shows execution mode plus shared `last_completed_stage` and completed-stage progress for both `Run All` and `Stage by Stage`
  - capability_id: inspection_debugging.checkpoint-status-and-next-stage-remain-staged-only-controls-layered-on-top-of-the-shared-progress-model
    name: Checkpoint status and `next_stage` remain staged-only controls layered on top of the shared progress model
  - capability_id: inspection_debugging.paused-manual-runs-expose-a-run-next-stage-control-in-run-detail-and-runs-list-views
    name: Paused manual runs expose a `Run Next Stage` control in run detail and runs list views
  - capability_id: inspection_debugging.run-detail-can-show-whether-a-run-scoped-synonym-overlay-is-active-for-a-manual-run-paused-after-enrich
    name: Run detail can show whether a run-scoped synonym overlay is active for a manual run paused after `enrich`
  - capability_id: inspection_debugging.run-detail-synonym-inspection-now-shows-a-collapsible-yaml-snapshot-for-either-the-active-run-overlay-or-the-default-synonym-config-when-available
    name: Run detail synonym inspection now shows a collapsible YAML snapshot for either the active run overlay or the default synonym config when available
  - capability_id: inspection_debugging.cv-download-links
    name: CV download links
  - capability_id: inspection_debugging.run-scoped-stage-transition-artifact-download-for-succeeded-runs-and-paused-manual-runs-when-available
    name: Run-scoped stage-transition artifact download for succeeded runs and paused manual runs when available
  - capability_id: inspection_debugging.run-detail-now-offers-download-all-artifacts-zip-as-a-convenience-bundle-of-currently-available-run-scoped-artifacts-plus-a-manifest-of-included-and-missing-files
    name: Run detail now offers `Download All Artifacts (.zip)` as a convenience bundle of currently available run-scoped artifacts plus a manifest of included and missing files
  - capability_id: inspection_debugging.run-scoped-settings-used-json-download-for-succeeded-runs-when-available
    name: Run-scoped settings-used JSON download for succeeded runs when available
  - capability_id: inspection_debugging.settings-used-snapshots-now-remain-accurate-after-the-config-room-reorganization-into-runtime-policy-and-taxonomy-subfolders
    name: Settings-used snapshots now remain accurate after the config-room reorganization into runtime, policy, and taxonomy subfolders
  - capability_id: inspection_debugging.timeline-linked-per-stage-stage-artifact-downloads-for-recognized-aggregate-stage-boundary-events-only
    name: Timeline-linked per-stage stage-artifact downloads for recognized aggregate stage-boundary events only
  - capability_id: inspection_debugging.run-detail-exports-now-hide-stage-owned-downloads-such-as-mapping-suggestions-json-until-the-owning-stage-has-actually-been-reached-and-the-owned-stage-artifact-exists
    name: Run-detail exports now hide stage-owned downloads such as `Mapping Suggestions JSON` until the owning stage has actually been reached and the owned stage artifact exists
  - capability_id: inspection_debugging.mapping-suggestions-snapshots-are-no-longer-persisted-before-enrich-avoiding-empty-pre-stage-exports
    name: Mapping-suggestions snapshots are no longer persisted before `enrich`, avoiding empty pre-stage exports
  - capability_id: inspection_debugging.normalize-now-always-emits-an-aggregate-timeline-row-that-can-own-download-normalize-json-even-when-deduplication-removes-zero-rows
    name: Normalize now always emits an aggregate timeline row that can own `Download Normalize JSON`, even when deduplication removes zero rows
  - capability_id: inspection_debugging.results-json-now-stays-focused-on-the-per-job-run-ledger-while-stage-artifacts-json-remains-the-bundled-diagnostic-export-for-stage-owned-metrics-reuse-and-samples
    name: '`results.json` now stays focused on the per-job run ledger while `stage-artifacts.json` remains the bundled diagnostic export for stage-owned metrics, reuse, and samples'
  - capability_id: inspection_debugging.results-ledger-rows-now-omit-full-original-job-full-enriched-job-bulky-score-explanation-substructures-and-full-cv-bodies-so-operator-facing-exports-stop-duplicating-stage-owned-diagnostics
    name: Results-ledger rows now omit full `original_job`, full `enriched_job`, bulky score-explanation substructures, and full CV bodies so operator-facing exports stop duplicating stage-owned diagnostics
  - capability_id: inspection_debugging.timeline-rows-now-use-humanized-stage-labels-plus-compact-aggregate-stage-summary-messaging-where-stage-artifacts-are-available
    name: Timeline rows now use humanized stage labels plus compact aggregate stage-summary messaging where stage artifacts are available
  - capability_id: inspection_debugging.stage-transition-artifacts-now-include-bounded-pre-decision-inputs-decision-summaries-and-output-change-state-samples-for-each-major-stage
    name: Stage-transition artifacts now include bounded pre-decision inputs, decision summaries, and output/change-state samples for each major stage
  - capability_id: inspection_debugging.stage-transition-artifacts-now-order-samples-outcome-first-with-outputs-and-dropped-or-changed-rows-before-raw-inputs
    name: Stage-transition artifacts now order samples outcome-first with outputs and dropped-or-changed rows before raw inputs
  - capability_id: inspection_debugging.enrich-stage-artifacts-and-settings-used-snapshots-can-expose-effective-enrich-prompt-provenance-including-prompt-id-version-template-path-and-model
    name: Enrich-stage artifacts and settings-used snapshots can expose effective enrich prompt provenance, including prompt ID, version, template path, and model
  - capability_id: inspection_debugging.prompt-provenance-for-cv-generation-now-reports-only-the-active-structured-writer-runtime-prompt-instead-of-implying-a-dormant-markdown-generation-prompt-is-live
    name: Prompt provenance for `cv_generation` now reports only the active structured writer runtime prompt instead of implying a dormant markdown-generation prompt is live
  - capability_id: inspection_debugging.ranking-stage-artifacts-now-expose-the-active-ai-score-prompt-id-prompt-template-path-and-model-so-reranker-drift-is-diagnosable-from-stage-local-logs
    name: Ranking-stage artifacts now expose the active AI-score prompt ID, prompt template path, and model so reranker drift is diagnosable from stage-local logs
  - capability_id: inspection_debugging.cv-generation-artifacts-and-debug-snapshots-now-expose-the-active-structured-writer-prompt-id-and-template-path-instead-of-relying-on-cv-prompt-version-alone
    name: '`cv_generation` artifacts and debug snapshots now expose the active structured writer prompt ID and template path instead of relying on `cv_prompt_version` alone'
  - capability_id: inspection_debugging.cv-debug-json-now-explains-ranked-job-coverage-with-attempted-vs-non-attempted-counts-and-omission-reasons
    name: '`cv-debug.json` now explains ranked-job coverage with attempted-vs-non-attempted counts and omission reasons'
  - capability_id: inspection_debugging.settings-used-json-now-presents-canonical-operator-facing-settings-and-moves-compatibility-era-flat-keys-into-an-explicit-compatibility-projection-block-when-present
    name: '`settings-used.json` now presents canonical operator-facing settings and moves compatibility-era flat keys into an explicit `compatibility_projection` block when present'
  - capability_id: inspection_debugging.ranking-stage-artifacts-report-the-full-six-feature-ranking-contract-zero-weight-features-and-ranked-vs-not-ranked-scoring-context
    name: Ranking-stage artifacts report the full six-feature ranking contract, zero-weight features, and ranked-vs-not-ranked scoring context
  - capability_id: inspection_debugging.newly-generated-stage-transition-artifacts-now-version-the-split-final-stage-artifact-shape-as-stage-transition-artifacts-v6
    name: Newly generated stage-transition artifacts now version the split final-stage artifact shape as `stage_transition_artifacts_v6`
  - capability_id: inspection_debugging.ranking-stage-artifacts-and-exports-now-expose-per-feature-weighted-score-contributions-plus-weighted-preference-fit-subcomponents
    name: Ranking-stage artifacts and exports now expose per-feature weighted score contributions plus weighted preference-fit subcomponents
  - capability_id: inspection_debugging.ranking-stage-decision-summaries-can-now-expose-configured-preference-fit-weights-and-fit-label-thresholds-for-calibration-debugging
    name: Ranking-stage decision summaries can now expose configured preference-fit weights and fit-label thresholds for calibration debugging
  - capability_id: inspection_debugging.run-scoped-cv-generation-debug-snapshot-download-for-succeeded-runs-when-available
