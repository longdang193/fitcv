inspection_debugging:
  name: Inspection & Debugging
  version: 2.5.0
  status: active
  type: add
  summary: "Admins can see what the pipeline did for a run, including paused manual checkpoints, enrich reuse provenance, selectable rule-filter marks, shortlist retrieval and embedding-reuse diagnostics, stage-local artifacts, inputs used, generated CVs, and explicit decision detail from exports, stage artifacts, settings-used snapshots, and CV debug snapshots."
  owner: fitcv_cp
  domains:
    - admin_ui
    - run_orchestration
  depends_on:
    - admin_control_plane_core
  primary_stage: cv_generation
  stages:
    - enrich
    - rule_filter
    - shortlist
    - ranking
    - cv_generation
  capabilities:
    - Run detail page with 3-tab inspection interface
    - Client-side tab switching
    - Filter outcome display with reasons and non-blocking marks
    - Pre-enrichment rejects visible separately
    - Immutable snapshots for all trigger modes
    - Run detail shows execution mode, checkpoint status, last completed stage, next stage, and completed-stage list for manual staged runs
    - Paused manual runs expose a `Run Next Stage` control in run detail and runs list views
    - Run detail can show whether a run-scoped synonym overlay is active for a manual run paused after `enrich`
    - CV download links
    - Run-scoped stage-transition artifact download for succeeded runs and paused manual runs when available
    - Run-scoped settings-used JSON download for succeeded runs when available
    - Timeline-linked per-stage stage-artifact downloads for recognized stage-boundary events
    - Stage-transition artifacts now include bounded pre-decision inputs, decision summaries, and output/change-state samples for each major stage
    - Enrich-stage artifacts and settings-used snapshots can expose effective enrich prompt provenance, including prompt ID, version, template path, and model
    - Ranking-stage artifacts report the full six-feature ranking contract, zero-weight features, and ranked-vs-not-ranked scoring context
    - Newly generated stage-transition artifacts now version the six-feature ranking artifact shape as `stage_transition_artifacts_v3`
    - Run-scoped CV-generation debug snapshot download for succeeded runs when available
    - Client-side filtering, search, and pagination for large tables
    - Job title as link label in generated outputs
    - Run detail pipeline outcomes can show explicit decision-chain detail when present in the run-results export
    - CV-generation debug snapshots separate authoritative ranking fit from explanatory gap output
    - Shortlist artifacts now distinguish raw vector row counts from unique-job raw-hit counts
    - Shortlist debug payloads now report observed raw-hit status without overstating retrieval root causes
    - Shortlist artifacts and run-results shortlist debug now expose latest-only retrieval facts, explicit raw-hit flags, and clearer backfill-versus-miss distinctions
    - Shortlist artifacts and run-results shortlist debug can now expose fresh-vs-reused embedding provenance plus structured signature metadata
    - Run-scoped enriched job rows can now include canonical skill companions and parsed mapping suggestions for richer inspection/debug export
    - Run-scoped enriched job rows and enrich-stage artifacts can now expose raw-job fingerprints, enrich-contract fingerprints, and fresh-vs-reused enrich provenance
    - Rule-filter stage artifacts and run detail now show the active blocking-filter set plus mark-code counts for selectable screening
