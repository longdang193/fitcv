[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fitcv"
version = "0.1.0"
requires-python = ">=3.11"
description = "End-to-end pipeline for ingesting job postings, matching against a candidate profile, and generating tailored CVs."
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "fitcv.tracker"
warn_unused_ignores = false
